server:
  port: 8084

spring:
  application:
    name: exam-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/exam_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    exchange:
      exam: exam.events
    routing:
      scheduled: exam.scheduled
      notify: exam.notify

springdoc:
  swagger-ui:
    path: /swagger-ui.html

course:
  service:
    base-url: http://localhost:8083

jwt:
  secret: unicampus-jwt-secret-key-for-cp3-2026-abcdef123456
  expiration: 3600000
