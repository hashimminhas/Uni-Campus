debug: false

spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:unicampus_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

logging:
  level:
    root: WARN
