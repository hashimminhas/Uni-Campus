server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # ── Global defaults ──────────────────────────────────────────
      default-filters:
        - RemoveResponseHeader=Access-Control-Allow-Origin
        - RemoveResponseHeader=Access-Control-Allow-Credentials
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

      # ── Routes ───────────────────────────────────────────────────
      routes:
        # Student Service (port 8081) — paths: /students/**
        - id: student-service
          uri: ${STUDENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/students/**
          filters:
            - StripPrefix=1

        # Notification Service (port 8082) — paths: /notifications/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        # Course Service (port 8083) — paths: /courses/**
        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/courses/**
          filters:
            - StripPrefix=1

        # Exam Service (port 8084) — paths: /exams/**
        - id: exam-service
          uri: ${EXAM_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/exams/**
          filters:
            - StripPrefix=1

        # Library Service (port 8085) — paths: /api/library/**
        - id: library-service
          uri: ${LIBRARY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/library/**

        # Billing Service (port 8086)
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/billing/**
          filters:
            - StripPrefix=1

        # Dormitory Service (port 8087)
        - id: dormitory-service
          uri: ${DORMITORY_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/dormitory/**
          filters:
            - StripPrefix=1

        # Meal Plan Service (port 8088)
        - id: mealplan-service
          uri: ${MEALPLAN_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/mealplan/**
          filters:
            - StripPrefix=1

# ── Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# ── Resilience4j circuit-breaker defaults ────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      studentServiceCB:
        base-config: default
      notificationServiceCB:
        base-config: default
      courseServiceCB:
        base-config: default
      examServiceCB:
        base-config: default
      libraryServiceCB:
        base-config: default
      billingServiceCB:
        base-config: default
      dormitoryServiceCB:
        base-config: default
      mealplanServiceCB:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

# ── Logging ──────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN
